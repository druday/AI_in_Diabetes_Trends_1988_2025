study:
  title: "From Silos to Synergy in AI-Driven Diabetology: A Temporal Institutional Network Analysis of Collaboration Patterns in PubMed"
  manuscript_period_start: 1946
  manuscript_period_end: 2025
  hard_publication_end_date: "2025-12-31"
  retrieval_date: "2026-05-16"
  notes:
    - "This protocol initializes the AI-in-diabetology replication framework."
    - "PubMed publication-date upper bound is hard-capped at 2025-12-31."
    - "Canonical manuscript bins are frozen to the currently accepted six-period output set."

entrez:
  db: "pubmed"
  batch_size: 100
  retmode: "text"
  rettype: "medline"
  max_records_per_query: null
  contact_email_env: "NCBI_EMAIL"
  api_key_env: "NCBI_API_KEY"

queries:
  - id: "ai_diabetes_1972_2012"
    query: >-
      (("Artificial Intelligence"[MeSH Terms] OR "Machine Learning"[MeSH Terms]
      OR "Data Mining"[MeSH Terms] OR "Decision Support Systems, Clinical"[MeSH Terms]
      OR "Neural Networks, Computer"[MeSH Terms]
      OR "artificial intelligence"[Title/Abstract] OR "machine learning"[Title/Abstract]
      OR "deep learning"[Title/Abstract] OR "neural network*"[Title/Abstract]
      OR "large language model*"[Title/Abstract] OR "computer vision"[Title/Abstract]
      OR "predictive model*"[Title/Abstract] OR "predictive analytics"[Title/Abstract]
      OR "data mining"[Title/Abstract] OR "clinical decision support"[Title/Abstract]
      OR "decision support system*"[Title/Abstract] OR "expert system*"[Title/Abstract]
      OR "pattern recognition"[Title/Abstract] OR "computational model*"[Title/Abstract]
      OR "digital health"[Title/Abstract] OR "mobile health"[Title/Abstract]
      OR mHealth[Title/Abstract] OR eHealth[Title/Abstract]
      OR "telemedicine"[Title/Abstract] OR "remote monitoring"[Title/Abstract])
      AND ("Diabetes Mellitus"[MeSH Terms] OR diabetes[Title/Abstract]
      OR diabetology[Title/Abstract] OR "type 1 diabetes"[Title/Abstract]
      OR "type 2 diabetes"[Title/Abstract] OR T1D[Title/Abstract] OR T2D[Title/Abstract]
      OR "gestational diabetes"[Title/Abstract] OR "diabetic retinopathy"[Title/Abstract]
      OR "diabetic nephropathy"[Title/Abstract] OR "diabetic neuropathy"[Title/Abstract]
      OR "glucose monitoring"[Title/Abstract]
      OR "continuous glucose monitor*"[Title/Abstract] OR CGM[Title/Abstract]
      OR "glycemic control"[Title/Abstract] OR "insulin pump*"[Title/Abstract]))
      AND (("1972/01/01"[Date - Publication] : "2022/01/01"[Date - Publication]))
  - id: "ai_diabetes_2022_2025"
    query: >-
      (("Artificial Intelligence"[MeSH Terms] OR "Machine Learning"[MeSH Terms]
      OR "Data Mining"[MeSH Terms] OR "Decision Support Systems, Clinical"[MeSH Terms]
      OR "Neural Networks, Computer"[MeSH Terms]
      OR "artificial intelligence"[Title/Abstract] OR "machine learning"[Title/Abstract]
      OR "deep learning"[Title/Abstract] OR "neural network*"[Title/Abstract]
      OR "large language model*"[Title/Abstract] OR "computer vision"[Title/Abstract]
      OR "predictive model*"[Title/Abstract] OR "predictive analytics"[Title/Abstract]
      OR "data mining"[Title/Abstract] OR "clinical decision support"[Title/Abstract]
      OR "decision support system*"[Title/Abstract] OR "expert system*"[Title/Abstract]
      OR "pattern recognition"[Title/Abstract] OR "computational model*"[Title/Abstract]
      OR "digital health"[Title/Abstract] OR "mobile health"[Title/Abstract]
      OR mHealth[Title/Abstract] OR eHealth[Title/Abstract]
      OR "telemedicine"[Title/Abstract] OR "remote monitoring"[Title/Abstract])
      AND ("Diabetes Mellitus"[MeSH Terms] OR diabetes[Title/Abstract]
      OR diabetology[Title/Abstract] OR "type 1 diabetes"[Title/Abstract]
      OR "type 2 diabetes"[Title/Abstract] OR T1D[Title/Abstract] OR T2D[Title/Abstract]
      OR "gestational diabetes"[Title/Abstract] OR "diabetic retinopathy"[Title/Abstract]
      OR "diabetic nephropathy"[Title/Abstract] OR "diabetic neuropathy"[Title/Abstract]
      OR "glucose monitoring"[Title/Abstract]
      OR "continuous glucose monitor*"[Title/Abstract] OR CGM[Title/Abstract]
      OR "glycemic control"[Title/Abstract] OR "insulin pump*"[Title/Abstract]))
      AND (("2022/01/02"[Date - Publication] : "2025/12/31"[Date - Publication]))

temporal_segmentation:
  mode: "fixed"
  fixed_periods:
    - {label: "1988-2015", start_year: 1988, end_year: 2015}
    - {label: "2016-2019", start_year: 2016, end_year: 2019}
    - {label: "2020-2021", start_year: 2020, end_year: 2021}
    - {label: "2022-2023", start_year: 2022, end_year: 2023}
    - {label: "2024-2024", start_year: 2024, end_year: 2024}
    - {label: "2025-2025", start_year: 2025, end_year: 2025}
  dynamic:
    n_bins: 6
    min_year: 1946
    max_year: 2025
    min_years_per_bin: 1
    use_observed_year_range: true

preprocessing:
  institution_extraction_mode: "exact_affiliation" # options: exact_affiliation, keyword_hint_segment
  remove_punctuation: true
  lowercase: true
  deduplicate_within_publication: true
  keep_only_records_with_affiliation: true
  institution_keyword_hints:
    - "university"
    - "institute"
    - "hospital"
    - "medical center"
    - "school"
    - "college"
    - "faculty"
    - "clinic"
    - "center"
    - "laboratory"
    - "department"
    - "academy"

screening:
  enabled: true
  require_all_include_terms: false
  include_terms:
    - "diabetes"
    - "diabetic"
    - "diabetology"
    - "type 1 diabetes"
    - "type 2 diabetes"
    - "t1d"
    - "t2d"
    - "gestational diabetes"
    - "diabetic retinopathy"
    - "diabetic nephropathy"
    - "diabetic neuropathy"
    - "glucose monitoring"
    - "continuous glucose monitor"
    - "cgm"
    - "glycemic control"
    - "insulin pump"
  exclude_terms: []

analysis:
  classification_source: "llm"
  llm_classifications_parquet: "data/llm/results/affiliation_classifications.parquet"

